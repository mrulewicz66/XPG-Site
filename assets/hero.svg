<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <style>
    .float-a { animation: bob 7s ease-in-out infinite alternate; }
    .float-b { animation: bob 9s ease-in-out infinite alternate-reverse; }
    .float-c { animation: bob 6s ease-in-out infinite alternate; }
    .twinkle { animation: twinkle 3.5s ease-in-out infinite; }
    .twinkle.slow { animation-duration: 5.5s; }
    .grid-run { animation: run 2.4s linear infinite; }
    .pulse { animation: pulse 6s ease-in-out infinite; }
    @keyframes bob { from { transform: translateY(-14px); } to { transform: translateY(14px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
    @keyframes run { from { transform: translateY(0); } to { transform: translateY(60px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) {
      .float-a, .float-b, .float-c, .twinkle, .grid-run, .pulse { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06070b"/>
      <stop offset="0.6" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#151026"/>
    </linearGradient>
    <radialGradient id="limeGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#c6f24e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c6f24e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b4cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b4cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3fb6e8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3fb6e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc83d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffc83d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="38%">
      <stop offset="0" stop-color="#07080c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#07080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ecff"/>
      <stop offset="0.5" stop-color="#b08cff"/>
      <stop offset="1" stop-color="#3d1a7a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f1f8"/>
      <stop offset="0.5" stop-color="#6c8094"/>
      <stop offset="1" stop-color="#b7c6d3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#e9b33a"/>
      <stop offset="1" stop-color="#9c6510"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="floor"><rect x="0" y="700" width="1920" height="380"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="960" cy="1080" rx="1100" ry="520" fill="url(#limeGlow)"/>

  <!-- ledger constellation -->
  <g stroke="#c6f24e" stroke-opacity="0.14" stroke-width="1.5" fill="none">
    <path d="M180 170 L420 110 L610 220 L820 140 M1110 120 L1330 210 L1520 120 L1760 230 M420 110 L470 300 L610 220 M1330 210 L1380 360 L1520 120"/>
  </g>
  <g fill="#c6f24e">
    <circle class="twinkle" cx="180" cy="170" r="4"/><circle class="twinkle slow" cx="420" cy="110" r="5"/>
    <circle class="twinkle" cx="610" cy="220" r="4"/><circle class="twinkle slow" cx="820" cy="140" r="3.5"/>
    <circle class="twinkle slow" cx="470" cy="300" r="3"/><circle class="twinkle" cx="1110" cy="120" r="3.5"/>
    <circle class="twinkle slow" cx="1330" cy="210" r="5"/><circle class="twinkle" cx="1520" cy="120" r="4"/>
    <circle class="twinkle slow" cx="1760" cy="230" r="4"/><circle class="twinkle" cx="1380" cy="360" r="3"/>
  </g>
  <g fill="#ffffff">
    <circle class="twinkle" cx="90" cy="420" r="1.8"/><circle class="twinkle slow" cx="300" cy="520" r="1.4"/>
    <circle class="twinkle" cx="700" cy="60" r="1.5"/><circle class="twinkle slow" cx="980" cy="70" r="1.8"/>
    <circle class="twinkle" cx="1240" cy="430" r="1.4"/><circle class="twinkle slow" cx="1650" cy="480" r="1.7"/>
    <circle class="twinkle" cx="1860" cy="90" r="1.5"/><circle class="twinkle slow" cx="1000" cy="300" r="1.2"/>
    <circle class="twinkle" cx="560" cy="420" r="1.3"/><circle class="twinkle slow" cx="1460" cy="40" r="1.2"/>
  </g>

  <!-- mountains -->
  <path d="M0 720 L180 600 L320 670 L520 540 L700 700 Z" fill="#0c0b1a"/>
  <path d="M1220 700 L1420 560 L1560 640 L1740 520 L1920 640 L1920 720 Z" fill="#0c0b1a"/>

  <!-- floor grid -->
  <rect x="0" y="700" width="1920" height="380" fill="#07060e"/>
  <g clip-path="url(#floor)" stroke="#c6f24e" stroke-width="1.6">
    <line x1="0" y1="700" x2="1920" y2="700" stroke-opacity="0.7" stroke-width="2.5"/>
    <g stroke-opacity="0.22">
      <line x1="960" y1="700" x2="960" y2="1080"/>
      <line x1="960" y1="700" x2="720" y2="1080"/><line x1="960" y1="700" x2="1200" y2="1080"/>
      <line x1="960" y1="700" x2="460" y2="1080"/><line x1="960" y1="700" x2="1460" y2="1080"/>
      <line x1="960" y1="700" x2="160" y2="1080"/><line x1="960" y1="700" x2="1760" y2="1080"/>
      <line x1="960" y1="700" x2="-200" y2="1080"/><line x1="960" y1="700" x2="2120" y2="1080"/>
      <line x1="960" y1="700" x2="-700" y2="1080"/><line x1="960" y1="700" x2="2620" y2="1080"/>
    </g>
    <g class="grid-run" stroke-opacity="0.2">
      <line x1="0" y1="640" x2="1920" y2="640"/><line x1="0" y1="700" x2="1920" y2="700"/>
      <line x1="0" y1="760" x2="1920" y2="760"/><line x1="0" y1="820" x2="1920" y2="820"/>
      <line x1="0" y1="880" x2="1920" y2="880"/><line x1="0" y1="940" x2="1920" y2="940"/>
      <line x1="0" y1="1000" x2="1920" y2="1000"/><line x1="0" y1="1060" x2="1920" y2="1060"/>
    </g>
  </g>
  <rect x="0" y="700" width="1920" height="380" fill="url(#floorFade)"/>

  <!-- Void Reaper, left -->
  <g class="float-a">
    <circle cx="390" cy="560" r="230" fill="url(#purpleGlow)" class="pulse"/>
    <g transform="translate(390 560) rotate(-18)" filter="url(#glow)">
      <circle r="120" fill="none" stroke="#a46bff" stroke-width="10" stroke-opacity="0.75"/>
      <circle r="88" fill="#05010a"/>
      <rect x="-8" y="-150" width="16" height="320" rx="7" fill="#2a1d40" stroke="#8f6ad8" stroke-width="2"/>
      <path d="M8 -132 C -20 -210, -130 -236, -210 -184 C -130 -188, -60 -160, -10 -96 Z" fill="url(#blade)"/>
      <circle cy="170" r="12" fill="#b06cff"/>
    </g>
  </g>

  <!-- Iron Shield, right -->
  <g class="float-b">
    <circle cx="1540" cy="560" r="220" fill="url(#blueGlow)" class="pulse"/>
    <g transform="translate(1540 560) rotate(8)" filter="url(#glow)">
      <path d="M0 -150 L112 -114 C 116 -10, 82 76, 0 146 C -82 76, -116 -10, -112 -114 Z" fill="url(#steel)" stroke="#20303f" stroke-width="4"/>
      <path d="M0 -122 L90 -92 C 92 -4, 64 64, 0 118 C -64 64, -92 -4, -90 -92 Z" fill="#12263b"/>
      <path d="M0 -60 L54 -22 L54 2 L0 -36 L-54 2 L-54 -22 Z M0 -4 L54 34 L54 58 L0 20 L-54 58 L-54 34 Z" fill="#7fd6ff"/>
    </g>
  </g>

  <!-- First Win, upper right -->
  <g class="float-c">
    <circle cx="1580" cy="250" r="140" fill="url(#goldGlow)" class="pulse"/>
    <g transform="translate(1580 250) scale(0.62)" filter="url(#glow)">
      <path d="M-80 -90 H80 V-6 C80 50 44 84 0 88 C-44 84 -80 50 -80 -6 Z" fill="url(#gold)"/>
      <path d="M-80 -72 C-126 -72 -132 -6 -74 18 M80 -72 C126 -72 132 -6 74 18" fill="none" stroke="#e9b33a" stroke-width="14" stroke-linecap="round"/>
      <rect x="-16" y="84" width="32" height="54" fill="#c88a16"/>
      <path d="M-50 138 H50 L62 170 H-62 Z" fill="url(#gold)"/>
      <path d="M0 -60 L11 -28 L45 -28 L18 -8 L28 24 L0 5 L-28 24 L-18 -8 L-45 -28 L-11 -28 Z" fill="#fff8e1"/>
    </g>
  </g>

  <!-- keep the middle calm, where the sign-in card sits -->
  <ellipse cx="960" cy="500" rx="560" ry="420" fill="url(#vignette)"/>
</svg>
